<!DOCTYPE html>
<html lang="en">
<head>
  {% block title %}<title>ACNet Fishing App</title>{% endblock %}
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta http-equiv="pragma" content="no-cache" />
  {% if live_trip %}
     <meta http-equiv="refresh" content="60">
  {% endif %}
  <!-- Add additional CSS in static file -->
  {% load static %}
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- App look and feel for the New / Edit / Delete form pages -->
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <!-- Phone-only layout fixes: only loaded on screens 768px wide or less -->
  <link rel="stylesheet" href="{% static 'css/phone.css' %}" media="(max-width: 768px)">
  <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
</head>
<body>
    <div class="site-shell"> <!-- from base_generic_refresh.html -->
        {% include "navbar.html" %}
        <main class="page-content">
                {% block content %}
                {% endblock %}
        </main>
        {% include 'footer.html' %}
    </div> <!-- from base_generic_refresh.html -->
</body>
</html>
