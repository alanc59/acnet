{% extends 'base_generic.html' %}

{% block content %}
<div class="container bg-info p-4">
    <h1>New Venue</h1>
    <form action="" method="post">{% csrf_token %}
        <div class="row">
            <div class="col"> </div>
            <div class="col-6">
                <table class="table">
                    <tr>
                        <td><label for="id_name">Name:</label></td>
                        <td><input type="text" name="name" maxlength="25" required id="id_name" value="{{ form.name.value|default_if_none:'' }}"></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td><label for="id_wac">WAC Water:</label></td>
                        <td><select name="wac" required id="id_wac">
                                <option value="N" {% if form.wac.value != 'Y' %}selected{% endif %}>No</option>
                                <option value="Y" {% if form.wac.value == 'Y' %}selected{% endif %}>Yes</option>
                            </select> 
                        </td>
                    </tr>
                    <tr>
                        <td><label for="id_postcode">Postcode:</label></td>
                        <td><input type="text" name="postcode" maxlength="10" required id="id_postcode" value="{{ form.postcode.value|default_if_none:'' }}"></td>
                        <td></td>
                    </tr>
                </table>
            </div>
            <div class="col"> </div>
        </div>
        {% if user.is_authenticated %}
            <div class="row">
                <div class="col text-center">
                    <button class="btn btn-sm btn-danger" type="submit" value="Save">Save</button>
                    <a class="btn btn-sm btn-secondary ms-2"
                       href="{% url 'venues' %}"
                       onclick="if (history.length > 1) { history.back(); return false; }">Cancel</a>
                </div>
            </div>
        {% endif %}

        {% if form.errors %}
            {% for field in form %}
                {% for error in field.errors %}
                    <div class="alert alert-danger mt-3">
                        <strong>{{ error|escape }}</strong>
                    </div>
                {% endfor %}
            {% endfor %}
        {% endif %}
    </form>
</div>

{% endblock content %}
